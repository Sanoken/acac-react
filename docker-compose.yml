version: '3.8'

services:
  acac:
    build: .
    container_name: acac-server
    ports:
      - "443:443"
      - "80:80"
    restart: always
    volumes:
      - ./certs:/etc/nginx/certs
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: always
    depends_on:
      - postgres
    ports:
      - "8443:8443"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
      KC_HOSTNAME: acac.dyndns.org
      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/acac-api.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/acac-api.key
    command: start
    volumes:
      - ./certs:/opt/keycloak/certs
    networks:
      - keycloak_network

  postgres:
    image: postgres:15
    container_name: keycloak_db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    volumes:
      - pg_data:/var/lib/postgresql/data
      - keycloak-certs:/opt/keycloak/certs
      - keycloak-providers:/opt/keycloak/providers
    networks:
      - keycloak_network

volumes:
  pg_data:
  keycloak-certs:
  keycloak-providers:

networks:
  keycloak_network:

